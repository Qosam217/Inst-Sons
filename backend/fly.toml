# fly.toml app configuration file generated for inst-sons-backend
app = "inst-sons-backend"
primary_region = "sin" # Singapore region (low latency to Southeast Asia)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=160 --optimize-for-size"


[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
